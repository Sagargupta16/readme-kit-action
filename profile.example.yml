          year: 2025
    - title: Tech talks
      entries:
        - text: GitOps Configuration Safety with Health Checks and Pipeline Gating
          year: 2026
        - text: Automating Unit Testing for Terraform using Terraform Test and PyTest frameworks
          year: 2025
    - title: Recognition

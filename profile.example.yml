          year: 2025
        - text: ML Hackathon 2025, 26th/238 teams
          year: 2025

# project-<key>.svg per entry, 410 wide so two sit side by side. The card shows
# the first sentence of description, cut to three lines, and the first tech
# chips that fit. live: true shows a pulsing LIVE badge instead of SOURCE.
# url is where the card links in snippet.md. key defaults to the title.
projects:
  - title: Kalchar # required
    date: May 2026
    description: >- # required
      Production folk-art portfolio and commission site for a traditional artist -
      Madhubani, Pichwai, Lippan, and Gond artwork gallery with a buy filter,
      events, workshops, custom orders, and a server-rendered admin panel. Public
      pages are static, catalog lives in Neon Postgres behind a single data seam,
      and artwork images are served from Cloudflare R2.
    tech: [Next.js 16, React 19, TypeScript, Tailwind CSS 4, Neon Postgres, Drizzle ORM, Cloudflare R2, Vercel]
    live: true
    url: https://kalchar.co.in/
  - title: GitScope
    date: March 2026
    description: >-
      A Chrome extension plus web dashboard that adds deep GitHub profile insights -
      9-stat grid, coding personality badges, language breakdown, activity heatmap,
      contribution donut, repo growth timeline, profile comparison, and a
      leaderboard across everyone you follow. Published on the Chrome Web Store
      with GitHub OAuth for traffic analytics.
    tech: [JavaScript, TypeScript, Chrome Extension, Manifest V3, GitHub GraphQL API, Cloudflare Workers, esbuild]
    live: true
    url: https://chromewebstore.google.com/detail/gitscope/fndaanihifimmlnmkjdmjbbkbdajolff
  - title: Ledger Sync
    date: July 2026
    description: >-
      A self-hosted personal finance dashboard (v2.19.0) with an AI chatbot that
      uses 15 read-only tool calls to answer questions about your spending, trends,
      tax, and goals. Upload Excel/CSV bank statements, get SHA-256 deduplication,
      50/30/20 budgeting, FIRE planning and India FY tax estimation.
    tech: [TypeScript, React 19, FastAPI, SQLite, Tailwind CSS, AWS Bedrock, OpenAI, Anthropic]
    live: true
    url: https://sagargupta.online/ledger-sync/
  - title: Blue Green AWS Terraform
    date: July 2025
    description: >-
      A comprehensive Infrastructure as Code solution for implementing Blue-Green
      deployment on AWS using Terraform, providing a complete CI/CD pipeline with
      zero-downtime deployments across ECS on EC2, ALB, CodePipeline, and
      KMS-encrypted artifacts.
    tech: [Terraform, AWS, Docker, ECS on EC2, CodePipeline, HCL]
    url: https://github.com/Sagargupta16/Blue_Green_AWS_Terraform


        - text: ProServe MLOps SME Program Graduate
          year: 2025
        - text: "5x TFC Ambassador: AI/ML, NGDE (Graduated), CloudOps (AWS DevOps Agent), Agentic AI, Serverless"
          year: "2025-2026"

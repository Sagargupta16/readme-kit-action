# readme-kit profile: every card of a GitHub profile README, from one file.
#
# Every top-level section is optional. A section that is present renders its
# card(s); leave it out, or set it to false, and nothing is written for it.
# Text is HTML-escaped before it reaches an SVG, and en or em dashes become
# plain hyphens. Quote values that contain ": " or start with a special
# character, and quote yes, no, on and off (YAML reads those as booleans).
#
# Cards are written to the action's output-dir (default assets/readme-kit),
# together with snippet.md: the README markup for every card, in this order.
#
# This file is the profile behind the cards on github.com/Sagargupta16, and it
# renders every image in examples/.

# accent replaces the blue family on every card: text, rails, bars and glows.
# Any #rrggbb color; the deeper shade is derived from it. Default #60a5fa.
theme:
  accent: "#60a5fa"

# user is whose public numbers a stats entry with `github:` reads (see stats).
# Optional: the action defaults it to the owner of the repository it runs in.
# github:
#   user: Sagargupta16

# hero.svg (840x250): name, kicker, rotating taglines, a status pill, location,
# and a constellation of up to five nodes wired to a hub.
hero:
  name: Sagar Gupta # required
  kicker: Hi, I am # small line above the name, shown in capitals
  role: ProServe Cloud Consultant at AWS # read out with the name by screen readers
  taglines: # take turns under the name, 3 seconds each, up to 12
    - Cloud Consultant, AWS Professional Services
    - DevOps and MLOps on AWS, in Terraform
    - Building AI agents and MCP tooling
    - Full stack developer, NIT Warangal alumnus
  status: Building cloud at AWS # green pill with a pulsing dot
  location: Hyderabad, India
  constellation: # every label fits 5 characters
    hub: MCP
    nodes: [AWS, TF, K8S, ML, CI] # up to 5, each wired to the hub

# terminal.svg: types each command, then shows its output lines.
terminal:
  prompt: "sagar@aws:~$" # a space is added after it
  title: "sagar@aws: ~" # centered in the title bar
  commands: # required, at least one
    - command: whoami
      output:
        - "Sagar Gupta  |  Cloud Consultant, AWS Professional Services (DevOps / MLOps)"
    - command: ls ~/published
      color: sky # output color: accent, sky, green or amber; default is dimmed white
      output:
        - aws-samples/sample-sagemaker-image-classification-mlops
        - aws-samples/sample-aws-terraform-org-governance
    - command: leetcode --profile sagargupta1610
      color: amber
      output:
        - "Guardian  |  rating 2166  |  top 1.11%  |  107 contests  |  1322 solved"

# header-<key>-dark.svg and header-<key>-light.svg per entry, numbered 01, 02
# and so on in this order. key names the files; it defaults to the title in
# lowercase with hyphens (Featured Projects -> featured-projects).
headers:
  - title: Experience # required
    subtitle: where I work and what shipped
    key: experience
  - title: Featured Projects
    subtitle: what I have built and shipped
    key: projects
  - title: Community and Developer Tools
    subtitle: open tooling for Claude Code and MCP
    key: community
  - title: Open Source
    subtitle: merged upstream work
    key: opensource
  - title: Connect With Me
    subtitle: where to find me
    key: connect
  - title: Tech Stack and Tools
    subtitle: what I work with daily
    key: stack
  - title: GitHub Stats
    subtitle: activity, streaks and contests
    key: stats
  - title: Certifications and Badges
    subtitle: verified on Credly
    key: certs

# divider.svg: a hairline with a pulse running along it. No options.
divider: true

# timeline.svg: milestones on a rail, oldest first. The last milestone is drawn
# as current (green, with a pulsing ring). expand opens it into a second rail
# of dated items, and makes the card taller (330 instead of 160).
timeline:
  title: Career
  milestones: # required, 2 to 6
    - year: 2021 # required
      title: MCA, NIT Warangal # required
      subtitle: NIMCET AIR 208
    - year: 2023
      title: Software Dev Intern
      subtitle: Ikarus-3D, Mohali
    - year: 2024
      title: ProServe DevOps Intern
      subtitle: AWS, Hyderabad
    - year: 2024
      tag: Full time # printed after the year
      title: DevOps/MLOps Cloud Consultant
      subtitle: AWS, Hyderabad
  expand:
    title: Customer engagements
    items: # required, 1 to 6
      - when: Oct 2024 to Aug 2025 # required
        title: State Street # required
        subtitle: Terraform module library
      - when: Aug 2025 to Dec 2025
        title: DTCC
        subtitle: Terraform modernization
      - when: Feb 2026 to now
        title: RWS
        subtitle: Lead DevOps, landing zone

# stats.svg: a four-column grid of big values, as many rows as needed.
# color: accent, sky, green or amber; default accent.
# Each entry needs value, github, or both. github reads a live number from the
# GitHub API at render time: repos, followers, stars (on repositories the user
# owns, forks left out), merged-prs, or upstream-merged-prs (merged in
# repositories the user does not own). If the read fails, value is shown
# instead, or n/a without one. For example:
#   - github: stars
#     value: 300+ # shown only if the API cannot be reached
#     label: stars on my repositories
stats:
  - value: 10/10 # value, github, or both
    label: average client CSAT # required
    color: green
  - value: 5/5
    label: average Pulse feedback
    color: green
  - value: 2
    label: published AWS samples
    color: sky
  - value: 5x
    label: TFC ambassador
    color: sky
  - value: 11
    label: merged upstream contributions
  - value: 6
    label: industry certifications
  - value: Guardian
    label: LeetCode, top 1.11%
    color: amber
  - value: "1,322"
    label: LeetCode problems solved
    color: amber

# tiles.svg: one row of up to six tiles. logo is an https URL of a PNG, JPEG,
# GIF, WebP or SVG image (256 KB at most), fetched at render time and inlined;
# with no logo, or when the fetch fails, the tile shows a two-letter monogram.
tiles:
  title: Worked with  |  Average CSAT 10/10  |  Average Pulse 5/5
  items: # required, 1 to 6
    - name: Amazon Web Services # required
      subtitle: DevOps/MLOps Cloud Consultant
      logo: "https://www.google.com/s2/favicons?domain=aws.amazon.com&sz=64"
    - name: RWS
      subtitle: Lead DevOps Consultant
      logo: "https://www.google.com/s2/favicons?domain=rws.com&sz=64"
    - name: DTCC
      subtitle: DevOps Consultant
      logo: "https://www.google.com/s2/favicons?domain=dtcc.com&sz=64"
    - name: State Street
      subtitle: DevOps Consultant
    - name: Ikarus-3D
      subtitle: Software Developer Associate (intern)

# panels.svg: up to four titled lists in a 2x2 grid, each entry with its year

name: "readme-kit"
description: "Turn one profile.yml into a matching set of self-hosted animated SVG cards for your GitHub profile README"
author: "Sagargupta16"

branding:
  icon: "layout"
  color: "blue"

inputs:
  config:
    description: "Path to the profile YAML file"
    required: false
    default: "profile.yml"
  output-dir:
    description: "Directory the SVG cards and snippet.md are written to"
    required: false
    default: "assets/readme-kit"
  commit:
    description: "true to commit output-dir on the checked-out branch and push it (needs contents: write)"
    required: false
    default: "false"
  branch:
    description: "Push the cards to this branch instead, as its only commit, so your main history stays clean; implies commit"
    required: false
    default: ""
  commit-message:
    description: "Message for the commit that commit or branch makes"
    required: false
    default: "chore: render readme cards"
  token:
    description: "Token for the GitHub API, used only when a stats entry reads a live number"
    required: false
    default: ${{ github.token }}

outputs:
  files:
    description: "Number of files written to output-dir: every SVG card plus snippet.md"
    value: ${{ steps.render.outputs.files }}
  committed:
    description: "true when commit or branch pushed a new commit, false otherwise"
    value: ${{ steps.render.outputs.committed }}

runs:
  using: "composite"
  steps:
    # update-environment: false keeps this Python off the consumer's PATH, so
    # steps after readme-kit still get whatever Python they set up themselves.
    - name: Set up Python
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        update-environment: false

    # Wheel only and pinned, so a consumer run never builds PyYAML from source
    # and never picks up a release nobody has tested here.
    - name: Install PyYAML
      shell: bash
      run: |
        "${{ steps.python.outputs.python-path }}" -m pip install --quiet --only-binary :all: pyyaml==6.0.3

    - name: Render cards
      id: render
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        COMMIT: ${{ inputs.commit }}
        BRANCH: ${{ inputs.branch }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        "${{ steps.python.outputs.python-path }}" "$GITHUB_ACTION_PATH/readme_kit.py"
